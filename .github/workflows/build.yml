name: CI

on:
  pull_request:
    branches: [ master ]

env:
  FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

jobs:
  build:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Build frontend
        # bash on both legs: the default pwsh on windows-latest only propagates the exit code
        # of the LAST command, so a failing `bun install` would not fail the step.
        shell: bash
        run: |
          cd src/internal/frontend
          bun install --frozen-lockfile
          bun run build

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Build project
        run: go build -v ./...

      - name: Assert CGO-free build (single static binary)
        env:
          CGO_ENABLED: 0
        run: go build -v ./...

  test-backend-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Create fake frontend dist
        run: |
          mkdir -p src/internal/frontend/dist
          echo "<html></html>" > src/internal/frontend/dist/index.html

      - name: Run unit tests
        run: go test -v ./src/tests/unit/... ./src/internal/...

  # Confirms the Windows cross-device (ERROR_NOT_SAME_DEVICE) errno mapping and hardlink
  # behavior, which can only be verified by actually running on Windows.
  test-backend-windows:
    runs-on: windows-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Run torrent + files package tests
        run: go test -v ./src/internal/files/... ./src/internal/torrents/...

  test-backend-integration:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build test images with cache
        run: |
          docker buildx build \
            --cache-from type=gha,scope=integration-daemon \
            --cache-to type=gha,mode=max,scope=integration-daemon \
            --tag test-daemon --load -f docker/Dockerfile .

          docker buildx build \
            --cache-from type=gha,scope=integration-mock-anilist \
            --cache-to type=gha,mode=max,scope=integration-mock-anilist \
            --tag test-mock-anilist --load \
            src/tests/mocks/anilist

          docker buildx build \
            --cache-from type=gha,scope=integration-mock-nyaa \
            --cache-to type=gha,mode=max,scope=integration-mock-nyaa \
            --tag test-mock-nyaa --load \
            src/tests/mocks/nyaa

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.25'
          cache: true

      - name: Start services
        run: docker compose -f docker/docker-compose.test.yml up -d --no-build daemon

      - name: Wait for daemon
        run: timeout 60 sh -c 'until curl -sf http://localhost:8091/api/v1/status; do sleep 1; done'

      - name: Run integration tests
        env:
          # DAEMON_URL is also the opt-in gate: without it the suite skips, so that a
          # plain `go test ./...` never reconfigures a daemon it wasn't pointed at.
          DAEMON_URL: http://localhost:8091
          # These paths are resolved inside the daemon *container*, not on the runner.
          # Keep them under /app/data (mounted volume) and on one filesystem — the config
          # endpoint hardlink-probes the pair and rejects cross-volume paths.
          TEST_SAVE_PATH: /app/data/aad-test/downloads
          TEST_COMPLETED_PATH: /app/data/aad-test/library
        run: go test -v ./src/tests/integration/...

      - name: Cleanup
        if: always()
        run: docker compose -f docker/docker-compose.test.yml down -v

  test-frontend-unit:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: cd src/internal/frontend && bun install --frozen-lockfile

      - name: Run unit tests
        run: cd src/internal/frontend && bun run test:unit

  test-frontend-component:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: cd src/internal/frontend && bun install --frozen-lockfile

      - name: Run component tests
        run: cd src/internal/frontend && bun run test:component

  test-frontend-smoke:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install dependencies
        run: cd src/internal/frontend && bun install --frozen-lockfile

      - name: Install Playwright browsers
        run: cd src/internal/frontend && bunx playwright install --with-deps chromium

      - name: Run smoke tests
        run: cd src/internal/frontend && bun run test:smoke
