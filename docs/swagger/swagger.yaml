  /torrents:
    get:
      consumes:
      - application/json
      description: Returns a live snapshot of every torrent in the embedded client
        — progress, speed, ETA, peers and status — joined with the anime/episode it
        belongs to. Batch torrents appear once, with a null episode_number. Responds
        with an empty list (not an error) when no session exists yet, i.e. before
        completed_anime_path is configured.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.TorrentResponse'
                  type: array
              type: object
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: List torrents
      tags:
      - torrents
  /torrents/{hash}:
    delete:
      consumes:
      - application/json
      description: Removes a torrent and every saved episode sharing its hash, as
        a single unit (the deletion boundary is the torrent, not the episode, so a
        batch's episodes always leave together). By default this frees both the seeding
        copy and the library hardlink (same inode); keep_data=true keeps both instead.
        block=true additionally blocks every episode in the group against automatic
        re-download.
      parameters:
      - description: Torrent info hash
        in: path
        name: hash
        required: true
        type: string
      - description: Keep the seeding copy and library hardlinks on disk (default
          false)
        in: query
        name: keep_data
        type: boolean
      - description: Block the torrent's episodes against automatic re-download (default
          false)
        in: query
        name: block
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Delete a torrent
      tags:
      - torrents
  /torrents/{hash}/announce:
    post:
      consumes:
      - application/json
      description: Re-announces the torrent to all trackers and DHT — the way out
        of "stuck at 0 peers". It does not override the trackers' minimum interval,
        so repeated calls have no extra effect.
      parameters:
      - description: Torrent info hash
        in: path
        name: hash
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Force a torrent re-announce
      tags:
      - torrents
  /torrents/{hash}/pause:
    post:
      consumes:
      - application/json
      description: 'Stops a torrent. Does not block: the torrent enters the "stopping"
        state and only reaches "stopped" up to ~5s later, once the stop event reaches
        the trackers. The paused state is persisted and survives a daemon restart.'
      parameters:
      - description: Torrent info hash
        in: path
        name: hash
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Pause a torrent
      tags:
      - torrents
  /torrents/{hash}/prioritize:
    post:
      consumes:
      - application/json
      description: Moves a torrent to the FRONT of the download queue and starts it
        immediately, pausing the least-progressed active torrent when that would exceed
        max_concurrent_downloads. Nothing is lost by the demotion — rain keeps the
        piece bitfield across a stop. A torrent that is already downloading is a no-op;
        an already-completed one is a 500.
      parameters:
      - description: Torrent info hash
        in: path
        name: hash
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Prioritize a torrent
      tags:
      - torrents
  /torrents/{hash}/resume:
    post:
      consumes:
      - application/json
      description: Puts a paused torrent at the BACK of the download queue and starts
        it if a slot is free — with max_concurrent_downloads set, resuming does not
        mean "start now" (use /prioritize for that). Re-arms the completion listener.
        A completed (seeding) torrent bypasses the queue.
      parameters:
      - description: Torrent info hash
        in: path
        name: hash
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Resume a torrent
      tags:
      - torrents
  /torrents/prioritize:
    post:
      consumes:
      - application/json
      description: 'Moves every listed torrent to the FRONT of the download queue,
        in the order received, and starts as many as max_concurrent_downloads allows
        — whatever is pushed past the limit pauses. Unknown or already-completed hashes
        are ignored rather than rejected: a list of episodes must not fail whole because
        one of them finished between the render and the click. Use this instead of
        N calls to /torrents/{hash}/prioritize, which would reverse the batch.'
      parameters:
      - description: Info hashes, most important first
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.PrioritizeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Prioritize several torrents at once
      tags:
      - torrents
schemes:
- http
swagger: "2.0"
