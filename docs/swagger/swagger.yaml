basePath: /api/v1
definitions:
  anilist.Health:
    properties:
      message:
        description: |-
          Message e a mensagem CRUA da AniList. Um 403 de IP bloqueado traz o motivo escrito para
          ser lido por humano; e a unica informacao que o frontend nao tem como reconstruir.
        type: string
      retry_at:
        description: |-
          RetryAt vem do Retry-After de um 429. Zero quando nao se aplica: so o rate limit informa
          quanto falta, e e o que permite mostrar contagem regressiva em vez de "tente mais tarde".
        type: string
      since:
        type: string
      state:
        example: ok
        type: string
    type: object
  api.AniListSearchResult:
    properties:
      block_reason:
        description: |-
          BlockReason e "" quando o anime pode ser adicionado como avulso, senao um dos motivos de
          standalone_guard.go. E UM CAMPO, nao quatro booleanos: os motivos sao mutuamente
          exclusivos por precedencia e o card precisa de um rotulo so. Vem do mesmo blockReason que
          o POST usa para decidir o 409 — e o que faz front e back concordarem por construcao.
        type: string
      cover:
        type: string
      episodes:
        description: Episodes e 0 quando a AniList nao sabe o total (o comum em anime
          ainda no ar).
        example: 24
        type: integer
      format:
        example: TV
        type: string
      id:
        example: 21
        type: integer
      status:
        example: RELEASING
        type: string
      title:
        example: One Piece
        type: string
      year:
        example: 1999
        type: integer
    type: object
  api.AnimeDetailResponse:
    properties:
      anime_id:
        description: |-
          AnimeID e o id da MIDIA na AniList — a mesma chave usada em episodes.json e nas rotas
          /animes/{id}/*, e tambem o id do link anilist.co/anime/{id} (ver decisions.md #43).
        type: integer
      cover_image:
        type: string
      custom_search_query:
        type: string
      episodes:
        items:
          $ref: '#/definitions/api.AnimeEpisodeInfo'
        type: array
      progress:
        type: integer
      status:
        type: string
      total_episodes:
        type: integer
    type: object
  api.AnimeEpisodeInfo:
    properties:
      airing_at:
        type: integer
      batch_end:
        type: integer
      batch_start:
        description: |-
          BatchStart/BatchEnd sao a faixa REAL do pack a que este episodio pertence, lida do nome do
          torrent no download. A tela nao consegue deduzi-la da lista: os episodios ja assistidos nao
          viram registro, entao o min/max dos registros de um mesmo hash encolhe o pack (um 01-11
          baixado com 5 assistidos aparecia como "6-11"). Pack sem faixa no nome ("(Season 1+OVA)
          [Batch]") conta como completo e vale 1..total. Omitidas quando 0 — registro antigo, ou nem
          o total do AniList e conhecido —, e ai o min/max volta a ser o melhor palpite.
        type: integer
      download_date:
        type: string
      episode_hash:
        description: |-
          EpisodeHash is the saved episode's torrent info hash. It is what lets the anime detail
          screen join in live torrent progress exactly: a batch torrent's saved episodes all carry
          the same hash but episode_number is meaningless for matching a torrent to them (the
          torrent itself has no single episode number), so joining by number would miss batches
          entirely. Joining by hash instead, single and batch episodes use the same path. Empty
          (and omitted via omitempty) when the episode has no saved record.
        type: string
      episode_number:
        description: |-
          EpisodeNumber e a identidade do episodio nas rotas /animes/{id}/episodes/{episodeNumber}/*:
          o id de no da AniList saiu de cena porque nao existe para episodio fora da janela de agenda
          que ela guarda (ver decisions.md #52).
        type: integer
      is_aired:
        type: boolean
      is_blocked:
        type: boolean
      is_downloaded:
        type: boolean
      is_manually_managed:
        type: boolean
      is_watched:
        type: boolean
      time_until_airing:
        type: integer
    type: object
  api.AnimeInfo:
    properties:
      alt_names:
        description: |-
          AltNames sao os outros titulos do mesmo anime (romaji, ingles, nativo/kanji e sinonimos),
          sem o proprio Name. Existe so para a busca da dashboard casar com o nome que o usuario
          conhece; nada renderiza esta lista.
        example:
        - ワンピース
        items:
          type: string
        type: array
      anime_id:
        example: 12345
        type: integer
      cover_image:
        type: string
      episodes_downloaded:
        example: 8
        type: integer
      episodes_pending:
        description: |-
          EpisodesPending conta episodios ja lancados, ainda nao assistidos e ainda nao baixados.
          Episodio assistido nunca e baixado (daemon.shouldSkipEpisode), entao ele nao pode contar
          como atraso — era isso que marcava meia lista como "atrasado" no frontend.
        example: 2
        type: integer
      episodes_released:
        example: 10
        type: integer
      episodes_watched:
        example: 5
        type: integer
      is_blacklisted:
        type: boolean
      is_standalone:
        description: |-
          IsStandalone marca os animes acompanhados pelo arquivo standalone_animes, e nao por uma
          lista da AniList. E ORIGEM, nao estado de download — por isso a tela o mostra num chip
          proprio ao lado do chip derivado, nunca dentro dele.
        type: boolean
      last_download_date:
        example: "2026-02-24T10:30:00Z"
        type: string
      latest_episode_number:
        example: 12
        type: integer
      name:
        example: Naruto
        type: string
      next_airing_at:
        description: |-
          NextAiringAt e o unix timestamp da estreia do proximo episodio, 0 quando nao ha nenhum
          agendado (anime terminado/cancelado). E o TIMESTAMP de proposito, e nao o timeUntilAiring
          da AniList: o front conta para tras sozinho, entao o numero nao congela junto com a
          resposta em cache.
        example: 1740394800
        type: integer
      total_episodes:
        example: 12
        type: integer
    type: object
  api.ErrorInfo:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  api.LogsResponse:
    properties:
      lines:
        items:
          type: string
        type: array
    type: object
  api.PrioritizeRequest:
    properties:
      hashes:
        description: |-
          Hashes is applied IN THE ORDER RECEIVED — the frontend decides the order, because it is
          what knows what the user clicked.
        example:
        - 0123456789abcdef0123456789abcdef01234567
        items:
          type: string
        type: array
    type: object
  api.StandaloneAnimeAddResponse:
    properties:
      added:
        description: |-
          Added e quantos episodios entraram na fila agora. 0 e resposta normal: um anime
          NOT_YET_RELEASED (ou um cujo proximo episodio ainda nao foi ao ar) fica acompanhado do
          mesmo jeito. Quem traduz isso e o toast, nao um codigo de erro.
        example: 3
        type: integer
    type: object
  api.StandaloneAnimeRequest:
    properties:
      media_id:
        example: 21
        type: integer
    type: object
  api.StatusResponse:
    properties:
      anilist:
        allOf:
        - $ref: '#/definitions/anilist.Health'
        description: |-
          Anilist e o ultimo estado conhecido da AniList, gravado por QUALQUER chamada (passe do
          daemon ou poll do frontend). Viaja aqui, e nao num endpoint proprio, porque /status ja e
          polled e ja e o payload que o WebSocket empurra — ver decisions.md #66.
      disk_free:
        example: 128849018880
        type: integer
      disk_low:
        description: |-
          DiskLow marca que o livre esta abaixo de min_free_disk_percent — ou seja, que o daemon
          PAROU de adicionar torrents. Calculado no servidor de proposito: um limiar duplicado no
          frontend acabaria discordando do que o daemon esta fazendo.
        example: false
        type: boolean
      disk_total:
        example: 500107862016
        type: integer
      has_error:
        example: false
        type: boolean
      last_check:
        example: "2024-01-01T00:00:00Z"
        type: string
      status:
        example: running
        type: string
      version:
        example: 1.2.0
        type: string
    type: object
  api.SuccessResponse:
    properties:
      data: {}
      error:
        $ref: '#/definitions/api.ErrorInfo'
      success:
        type: boolean
    type: object
  api.TorrentResponse:
    properties:
      anime_id:
        example: 154587
        type: integer
      anime_name:
        example: Sousou no Frieren
        type: string
      bytes_completed:
        example: 524288000
        type: integer
      bytes_total:
        description: BytesTotal is 0 until the torrent's metadata arrives.
        example: 1073741824
        type: integer
      bytes_uploaded:
        example: 104857600
        type: integer
      completed:
        description: |-
          Completed is piece-derived (TorrentInfo.Completed), not Status-derived — it stays true
          for a torrent paused after finishing, which Status alone cannot tell apart from a
          paused, unfinished one. Used to key the list sort instead of Status.
        example: false
        type: boolean
      download_speed:
        example: 2097152
        type: integer
      episode_number:
        description: EpisodeNumber is null for batch torrents (they map to several
          episodes).
        type: integer
      eta_seconds:
        description: EtaSeconds is null when unknown or infinite.
        example: 240
        type: integer
      hash:
        example: 0123456789abcdef0123456789abcdef01234567
        type: string
      is_batch:
        example: false
        type: boolean
      name:
        example: '[SubsPlease] Frieren - 07 (1080p).mkv'
        type: string
      peers_total:
        example: 14
        type: integer
      progress:
        description: |-
          Progress is 0..1: BytesCompleted/BytesTotal normally, falling back to the piece ratio
          (PiecesHave/PiecesTotal) when BytesCompleted reads 0 with a paused torrent — see
          buildTorrentResponse. 0 while BytesTotal and PiecesTotal are both unknown.
        example: 0.48
        type: number
      queue_position:
        description: |-
          QueuePosition is the 1-based place in the download queue's waiting line; 0 means the
          torrent is not waiting (active, completed, or paused by the user). Not a pointer: 0
          already says "not queued" without ambiguity — there is no position 0.
        example: 3
        type: integer
      seeded_for_seconds:
        example: 3600
        type: integer
      status:
        example: downloading
        type: string
      upload_speed:
        example: 524288
        type: integer
    type: object
  api.animeSettingsRequest:
    properties:
      custom_search_query:
        type: string
      progress:
        type: integer
    type: object
  daemon.CheckReport:
    properties:
      finished_at:
        example: "2026-08-19T12:00:00Z"
        type: string
      limits:
        items:
          $ref: '#/definitions/daemon.Issue'
        type: array
      pass_error:
        example: ""
        type: string
      pass_error_code:
        description: |-
          PassErrorCode e a CAUSA do aborto, para o frontend montar a frase. PassError continua
          carregando o texto cru, que a tela mostra recolhido: sem ele um usuario que quer abrir
          issue nao tem o que colar. Ver passerror.go.
        example: anilist
        type: string
      problems:
        items:
          $ref: '#/definitions/daemon.Issue'
        type: array
    type: object
  daemon.Issue:
    properties:
      anime_id:
        example: 269
        type: integer
      anime_name:
        example: Bleach
        type: string
      batch_skipped:
        example: no_result
        type: string
      candidates:
        example: 8
        type: integer
      code:
        example: all_above_size_limit
        type: string
      downloaded:
        description: |-
          Downloaded e quantos episodios CONSUMIRAM uma vaga sob o teto, nao quantos baixaram neste
          passe: handleAlreadySavedEpisode tambem incrementa o contador para episodio ja salvo. E o
          numero certo para a frase "baixou N, sobraram M" — os N ja estao na biblioteca —, mas quem
          ler isso como "downloads deste passe" vai se enganar.
        example: 12
        type: integer
      episodes:
        description: |-
          Episodes so e preenchido em PROBLEMA: um problema acontece num episodio (ele foi buscado,
          os candidatos foram avaliados, aquele episodio nao baixou). O limite e o contrario — o
          daemon parou de considerar episodios ao atingir a conta, entao nao existe "os episodios
          afetados", existe uma quantidade que sobrou (Downloaded/Pending).
        items:
          type: integer
        type: array
      limit_gb:
        example: 3
        type: number
      min_seeders:
        example: 1
        type: integer
      pending:
        example: 35
        type: integer
    type: object
  files.Config:
    properties:
      anilist_username:
        type: string
      anilist_usernames:
        items:
          type: string
        type: array
      anime_ids_are_media_ids:
        description: |-
          AnimeIDsAreMediaIDs marca que daemon.MigrateAnimeIDsToMedia ja converteu os AnimeID
          gravados de id de ENTRADA (MediaList, por conta) para id de MIDIA (ver decisions.md #43).
          O default e false de proposito: um config.json anterior a este campo desserializa por
          cima do default e precisa migrar. Numa instalacao nova a migracao roda sem nada a fazer
          e liga o campo no primeiro passe.
        type: boolean
      check_interval:
        type: integer
      completed_anime_path:
        type: string
      delete_statuses:
        items:
          type: string
        type: array
      delete_watched_episodes:
        type: boolean
      download_media_statuses:
        items:
          type: string
        type: array
      download_statuses:
        items:
          type: string
        type: array
      episode_retry_limit:
        type: integer
      excluded_list:
        type: string
      excluded_lists:
        items:
          type: string
        type: array
      max_batch_torrent_size_gb:
        description: |-
          MaxBatchTorrentSizeGB / MaxEpisodeTorrentSizeGB descartam da busca torrents acima do teto,
          em GiB. 0 desliga. O de pack e a guarda UNICA de pack desde que a elegibilidade deixou de
          ser contagem de episodios: 100 cabe pack completo de serie de temporada em 1080p e nao cabe
          pack completo de One Piece — para serie longa o que passa e pack parcial.
        type: number
      max_concurrent_downloads:
        description: |-
          MaxConcurrentDownloads limita quantos torrents INCOMPLETOS baixam ao mesmo tempo; o
          excedente espera na fila (torrents.queue). 0 desliga o limite. Seeding nunca conta.

          Nao precisa de migracao: LoadConfigs desserializa POR CIMA de getDefaultConfig(),
          entao um config.json anterior a este campo ja carrega valendo o default.
        type: integer
      max_episode_torrent_size_gb:
        type: number
      max_episodes_per_anime:
        description: |-
          MaxEpisodesPerAnime limita quantos episodios de um anime existem ao mesmo tempo, e vale
          APENAS no caminho episodio-a-episodio: um batch e um torrent so, entao limitar registros
          nao limitaria bytes nem arquivos na biblioteca (ver decisions.md). 0 significa SEM TETO
          (ver effectiveMax/windowEnd em daemon/episodes.go).
        type: integer
      max_search_pages:
        description: |-
          MaxSearchPages e o teto de paginas do Nyaa por busca. A busca desce para a pagina
          seguinte apenas enquanto tiver poucos candidatos aceitos, entao o teto e um limite, nao
          um custo fixo. <= 1 significa buscar so a pagina 1.
        type: integer
      min_free_disk_percent:
        description: |-
          MinFreeDiskPercent barra a adicao de novos torrents abaixo dessa porcentagem de espaco
          livre no volume da biblioteca. 0 desliga.
        type: integer
      min_seeders:
        description: |-
          MinSeeders descarta da busca o torrent com menos seeders que isso. 0 desliga. O default
          e 1: barra so o torrent literalmente morto, que sem piso e candidato valido e chega a ser
          escolhido quando e o unico resultado do episodio.
        type: integer
      notifications:
        $ref: '#/definitions/files.NotificationsConfig'
      priorities:
        $ref: '#/definitions/nyaa.Priorities'
      rename_files_for_jellyfin:
        type: boolean
      watched_episodes_to_keep:
        type: integer
    type: object
  files.NotificationsConfig:
    properties:
      batch_window_seconds:
        description: |-
          BatchWindowSeconds agrupa os eventos de uma mesma janela num webhook so. 0 desliga o
          agrupamento (um webhook por evento, comportamento original). Existe porque um backfill
          de biblioteca dispara um `download_completed` por torrent e estoura a cota de servicos
          como o ntfy.sh — ver decisions.md #47.
        type: integer
      webhooks:
        items:
          $ref: '#/definitions/files.WebhookPreset'
        type: array
    type: object
  files.WebhookPreset:
    properties:
      body:
        type: string
      events:
        items:
          type: string
        type: array
      headers:
        additionalProperties:
          type: string
        type: object
      method:
        type: string
      name:
        type: string
      url:
        type: string
    type: object
  nyaa.Priorities:
    properties:
      audio:
        items:
          type: string
        type: array
      codecs:
        items:
          type: string
        type: array
      criteria_order:
        description: |-
          CriteriaOrder é a ordem em que os critérios de sort são aplicados.
          Valores válidos: uncensored, source, resolution, codec, fansub, audio, health, size.
        items:
          type: string
        type: array
      fansubs:
        items:
          type: string
        type: array
      ignore_list:
        description: 'IgnoreList: substrings (case-insensitive) que descartam o release
          de vez.'
        items:
          type: string
        type: array
      resolutions:
        items:
          type: string
        type: array
      sources:
        items:
          type: string
        type: array
    type: object
host: localhost:8091
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: REST API for Auto Anime Downloader daemon
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
  termsOfService: http://swagger.io/terms/
  title: Auto Anime Downloader API
  version: "1.0"
paths:
  /anilist/search:
    get:
      description: Searches AniList by term and flags which results can be added as
        standalone animes
      parameters:
      - description: Search term (fewer than 3 characters returns an empty list)
        in: query
        name: q
        required: true
        type: string
      - description: Include animes that have not aired yet (NOT_YET_RELEASED). Default
          false
        in: query
        name: include_unreleased
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.AniListSearchResult'
                  type: array
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Search animes on AniList
      tags:
      - standalone
  /animes:
    get:
      consumes:
      - application/json
      description: Returns a list of animes with aggregated episode information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.AnimeInfo'
                  type: array
              type: object
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Get animes list
      tags:
      - animes
  /animes/{id}/episodes:
    get:
      consumes:
      - application/json
      description: Returns anime info from AniList combined with downloaded episodes
        data
      parameters:
      - description: Anime ID (AniList media ID)
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.AnimeDetailResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Get detail and episodes for a specific anime
      tags:
      - animes
  /animes/{id}/episodes/{episodeNumber}:
    delete:
      consumes:
      - application/json
      description: Deletes a downloaded episode (library hardlink + torrent) and blocks
        it from being re-downloaded automatically
      parameters:
      - description: Anime ID (AniList MediaList ID)
        in: path
        name: id
        required: true
        type: integer
      - description: Episode number (1-based, as aired)
        in: path
        name: episodeNumber
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Manually delete a downloaded episode
      tags:
      - animes
  /animes/{id}/episodes/{episodeNumber}/download:
    post:
      consumes:
      - application/json
      description: Triggers an immediate download for an aired episode and marks it
        as manually managed
      parameters:
      - description: Anime ID (AniList MediaList ID)
        in: path
        name: id
        required: true
        type: integer
      - description: Episode number (1-based, as aired)
        in: path
        name: episodeNumber
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Manually download an episode
      tags:
      - animes
  /animes/{id}/episodes/{episodeNumber}/redownload:
    post:
      consumes:
      - application/json
      description: Deletes the existing torrent (if any) and searches Nyaa again for
        a fresh download
      parameters:
      - description: Anime ID (AniList MediaList ID)
        in: path
        name: id
        required: true
        type: integer
      - description: Episode number (1-based, as aired)
        in: path
        name: episodeNumber
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
