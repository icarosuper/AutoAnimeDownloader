basePath: /api/v1
definitions:
  api.AnimeDetailResponse:
    properties:
      anime_id:
        description: |-
          AnimeID e o id da MIDIA na AniList — a mesma chave usada em episodes.json e nas rotas
          /animes/{id}/*, e tambem o id do link anilist.co/anime/{id} (ver decisions.md #43).
        type: integer
      cover_image:
        type: string
      custom_search_query:
        type: string
      episodes:
        items:
          $ref: '#/definitions/api.AnimeEpisodeInfo'
        type: array
      progress:
        type: integer
      status:
        type: string
      total_episodes:
        type: integer
    type: object
  api.AnimeEpisodeInfo:
    properties:
      airing_at:
        type: integer
      download_date:
        type: string
      episode_hash:
        description: |-
          EpisodeHash is the saved episode's torrent info hash. It is what lets the anime detail
          screen join in live torrent progress exactly: a batch torrent's saved episodes all carry
          the same hash but episode_number is meaningless for matching a torrent to them (the
          torrent itself has no single episode number), so joining by number would miss batches
          entirely. Joining by hash instead, single and batch episodes use the same path. Empty
          (and omitted via omitempty) when the episode has no saved record.
        type: string
      episode_id:
        type: integer
      episode_name:
        type: string
      episode_number:
        type: integer
      is_aired:
        type: boolean
      is_blocked:
        type: boolean
      is_downloaded:
        type: boolean
      is_manually_managed:
        type: boolean
      is_watched:
        type: boolean
      time_until_airing:
        type: integer
    type: object
  api.AnimeInfo:
    properties:
      anime_id:
        example: 12345
        type: integer
      cover_image:
        type: string
      episodes_downloaded:
        example: 8
        type: integer
      episodes_pending:
        description: |-
          EpisodesPending conta episodios ja lancados, ainda nao assistidos e ainda nao baixados.
          Episodio assistido nunca e baixado (daemon.shouldSkipEpisode), entao ele nao pode contar
          como atraso — era isso que marcava meia lista como "atrasado" no frontend.
        example: 2
        type: integer
      episodes_released:
        example: 10
        type: integer
      episodes_watched:
        example: 5
        type: integer
      is_blacklisted:
        type: boolean
      last_download_date:
        example: "2026-02-24T10:30:00Z"
        type: string
      latest_episode_id:
        example: 12
        type: integer
      name:
        example: Naruto
        type: string
      total_episodes:
        example: 12
        type: integer
    type: object
  api.ErrorInfo:
    properties:
      code:
        type: string
      message:
        type: string
    type: object
  api.LogsResponse:
    properties:
      lines:
        items:
          type: string
        type: array
    type: object
  api.PrioritizeRequest:
    properties:
      hashes:
        description: |-
          Hashes is applied IN THE ORDER RECEIVED — the frontend decides the order, because it is
          what knows what the user clicked.
        example:
        - 0123456789abcdef0123456789abcdef01234567
        items:
          type: string
        type: array
    type: object
  api.StatusResponse:
    properties:
      disk_free:
        example: 128849018880
        type: integer
      disk_total:
        example: 500107862016
        type: integer
      has_error:
        example: false
        type: boolean
      last_check:
        example: "2024-01-01T00:00:00Z"
        type: string
      status:
        example: running
        type: string
      version:
        example: 1.2.0
        type: string
    type: object
  api.SuccessResponse:
    properties:
      data: {}
      error:
        $ref: '#/definitions/api.ErrorInfo'
      success:
        type: boolean
    type: object
  api.TorrentResponse:
    properties:
      anime_id:
        example: 154587
        type: integer
      anime_name:
        example: Sousou no Frieren
        type: string
      bytes_completed:
        example: 524288000
        type: integer
      bytes_total:
        description: BytesTotal is 0 until the torrent's metadata arrives.
        example: 1073741824
        type: integer
      bytes_uploaded:
        example: 104857600
        type: integer
      completed:
        description: |-
          Completed is piece-derived (TorrentInfo.Completed), not Status-derived — it stays true
          for a torrent paused after finishing, which Status alone cannot tell apart from a
          paused, unfinished one. Used to key the list sort instead of Status.
        example: false
        type: boolean
      download_speed:
        example: 2097152
        type: integer
      episode_number:
        description: EpisodeNumber is null for batch torrents (they map to several
          episodes).
        type: integer
      eta_seconds:
        description: EtaSeconds is null when unknown or infinite.
        example: 240
        type: integer
      hash:
        example: 0123456789abcdef0123456789abcdef01234567
        type: string
      is_batch:
        example: false
        type: boolean
      name:
        example: '[SubsPlease] Frieren - 07 (1080p).mkv'
        type: string
      peers_total:
        example: 14
        type: integer
      progress:
        description: |-
          Progress is 0..1: BytesCompleted/BytesTotal normally, falling back to the piece ratio
          (PiecesHave/PiecesTotal) when BytesCompleted reads 0 with a paused torrent — see
          buildTorrentResponse. 0 while BytesTotal and PiecesTotal are both unknown.
        example: 0.48
        type: number
      queue_position:
        description: |-
          QueuePosition is the 1-based place in the download queue's waiting line; 0 means the
          torrent is not waiting (active, completed, or paused by the user). Not a pointer: 0
          already says "not queued" without ambiguity — there is no position 0.
        example: 3
        type: integer
      seeded_for_seconds:
        example: 3600
        type: integer
      status:
        example: downloading
        type: string
      upload_speed:
        example: 524288
        type: integer
    type: object
  api.animeSettingsRequest:
    properties:
      custom_search_query:
        type: string
    type: object
  files.Config:
    properties:
      anilist_username:
        type: string
      anilist_usernames:
        items:
          type: string
        type: array
      anime_ids_are_media_ids:
        description: |-
          AnimeIDsAreMediaIDs marca que daemon.MigrateAnimeIDsToMedia ja converteu os AnimeID
          gravados de id de ENTRADA (MediaList, por conta) para id de MIDIA (ver decisions.md #43).
          O default e false de proposito: um config.json anterior a este campo desserializa por
          cima do default e precisa migrar. Numa instalacao nova a migracao roda sem nada a fazer
          e liga o campo no primeiro passe.
        type: boolean
      check_interval:
        type: integer
      completed_anime_path:
        type: string
      delete_statuses:
        items:
          type: string
        type: array
      delete_watched_episodes:
        type: boolean
      download_media_statuses:
        items:
          type: string
        type: array
      download_statuses:
        items:
          type: string
        type: array
      episode_retry_limit:
        type: integer
      excluded_list:
        type: string
      excluded_lists:
        items:
          type: string
        type: array
      max_concurrent_downloads:
        description: |-
          MaxConcurrentDownloads limita quantos torrents INCOMPLETOS baixam ao mesmo tempo; o
          excedente espera na fila (torrents.queue). 0 desliga o limite. Seeding nunca conta.

          Nao precisa de migracao: LoadConfigs desserializa POR CIMA de getDefaultConfig(),
          entao um config.json anterior a este campo ja carrega valendo o default.
        type: integer
      max_episodes_per_anime:
        type: integer
      notifications:
        $ref: '#/definitions/files.NotificationsConfig'
      priorities:
        $ref: '#/definitions/nyaa.Priorities'
      rename_files_for_jellyfin:
        type: boolean
      watched_episodes_to_keep:
        type: integer
    type: object
  files.NotificationsConfig:
    properties:
      batch_window_seconds:
        description: |-
          BatchWindowSeconds agrupa os eventos de uma mesma janela num webhook so. 0 desliga o
          agrupamento (um webhook por evento, comportamento original). Existe porque um backfill
          de biblioteca dispara um `download_completed` por torrent e estoura a cota de servicos
          como o ntfy.sh — ver decisions.md #47.
        type: integer
      webhooks:
        items:
          $ref: '#/definitions/files.WebhookPreset'
        type: array
    type: object
  files.WebhookPreset:
    properties:
      body:
        type: string
      events:
        items:
          type: string
        type: array
      headers:
        additionalProperties:
          type: string
        type: object
      method:
        type: string
      name:
        type: string
      url:
        type: string
    type: object
  nyaa.Priorities:
    properties:
      audio:
        items:
          type: string
        type: array
      codecs:
        items:
          type: string
        type: array
      criteria_order:
        description: |-
          CriteriaOrder é a ordem em que os critérios de sort são aplicados.
          Valores válidos: uncensored, source, resolution, codec, fansub, audio, health, size.
        items:
          type: string
        type: array
      fansubs:
        items:
          type: string
        type: array
      ignore_list:
        description: 'IgnoreList: substrings (case-insensitive) que descartam o release
          de vez.'
        items:
          type: string
        type: array
      resolutions:
        items:
          type: string
        type: array
      sources:
        items:
          type: string
        type: array
    type: object
host: localhost:8091
info:
  contact:
    email: support@swagger.io
    name: API Support
    url: http://www.swagger.io/support
  description: REST API for Auto Anime Downloader daemon
  license:
    name: GPL-3.0
    url: https://www.gnu.org/licenses/gpl-3.0.html
  termsOfService: http://swagger.io/terms/
  title: Auto Anime Downloader API
  version: "1.0"
paths:
  /animes:
    get:
      consumes:
      - application/json
      description: Returns a list of animes with aggregated episode information
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.AnimeInfo'
                  type: array
              type: object
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Get animes list
      tags:
      - animes
  /animes/{id}/episodes:
    get:
      consumes:
      - application/json
      description: Returns anime info from AniList combined with downloaded episodes
        data
      parameters:
      - description: Anime ID (AniList media ID)
        in: path
        name: id
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.AnimeDetailResponse'
              type: object
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Get detail and episodes for a specific anime
      tags:
      - animes
  /animes/{id}/episodes/{episodeId}:
    delete:
      consumes:
      - application/json
      description: Deletes a downloaded episode (library hardlink + torrent) and blocks
        it from being re-downloaded automatically
      parameters:
      - description: Anime ID (AniList MediaList ID)
        in: path
        name: id
        required: true
        type: integer
      - description: Episode ID (AniList AiringNode ID)
        in: path
        name: episodeId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Manually delete a downloaded episode
      tags:
      - animes
  /animes/{id}/episodes/{episodeId}/download:
    post:
      consumes:
      - application/json
      description: Triggers an immediate download for an aired episode and marks it
        as manually managed
      parameters:
      - description: Anime ID (AniList MediaList ID)
        in: path
        name: id
        required: true
        type: integer
      - description: Episode ID (AniList AiringNode ID)
        in: path
        name: episodeId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Manually download an episode
      tags:
      - animes
  /animes/{id}/episodes/{episodeId}/redownload:
    post:
      consumes:
      - application/json
      description: Deletes the existing torrent (if any) and searches Nyaa again for
        a fresh download
      parameters:
      - description: Anime ID (AniList MediaList ID)
        in: path
        name: id
        required: true
        type: integer
      - description: Episode ID (AniList AiringNode ID)
        in: path
        name: episodeId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Redownload an episode from Nyaa
      tags:
      - animes
  /animes/{id}/episodes/{episodeId}/release:
    post:
      consumes:
      - application/json
      description: Unblocks and unmanages an episode so the daemon can handle it automatically
        again
      parameters:
      - description: Anime ID (AniList MediaList ID)
        in: path
        name: id
        required: true
        type: integer
      - description: Episode ID (AniList AiringNode ID)
        in: path
        name: episodeId
        required: true
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Release an episode from manual management
      tags:
      - animes
  /animes/{id}/episodes/{episodeId}/replace:
    post:
      consumes:
      - application/json
      description: Deletes the existing torrent (if any) and downloads the episode
        using the provided magnet link
      parameters:
      - description: Anime ID (AniList MediaList ID)
        in: path
        name: id
        required: true
        type: integer
      - description: Episode ID (AniList AiringNode ID)
        in: path
        name: episodeId
        required: true
        type: integer
      - description: Magnet link
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Replace a downloaded episode with a user-supplied magnet link
      tags:
      - animes
  /animes/{id}/replace:
    post:
      consumes:
      - application/json
      description: Deletes all existing torrents for the anime and downloads using
        the provided magnet link, marking all aired episodes as downloaded
      parameters:
      - description: Anime ID (AniList MediaList ID)
        in: path
        name: id
        required: true
        type: integer
      - description: Magnet link
        in: body
        name: body
        required: true
        schema:
          type: object
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Replace all downloaded episodes of an anime with a user-supplied batch
        magnet link
      tags:
      - animes
  /animes/{id}/settings:
    get:
      consumes:
      - application/json
      description: GET returns current settings; PUT updates them
      parameters:
      - description: Anime ID (AniList MediaList ID)
        in: path
        name: id
        required: true
        type: integer
      - description: Settings
        in: body
        name: body
        schema:
          $ref: '#/definitions/api.animeSettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Get or update anime-specific settings
      tags:
      - animes
    put:
      consumes:
      - application/json
      description: GET returns current settings; PUT updates them
      parameters:
      - description: Anime ID (AniList MediaList ID)
        in: path
        name: id
        required: true
        type: integer
      - description: Settings
        in: body
        name: body
        schema:
          $ref: '#/definitions/api.animeSettingsRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Get or update anime-specific settings
      tags:
      - animes
  /check:
    post:
      consumes:
      - application/json
      description: Triggers a manual anime verification check
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Trigger manual check
      tags:
      - daemon
  /config:
    get:
      consumes:
      - application/json
      description: Returns the current daemon configuration
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/files.Config'
              type: object
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Get configuration
      tags:
      - config
    put:
      consumes:
      - application/json
      description: Updates the daemon configuration with the provided values
      parameters:
      - description: Configuration object
        in: body
        name: config
        required: true
        schema:
          $ref: '#/definitions/files.Config'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Update configuration
      tags:
      - config
  /config/priorities/defaults:
    get:
      description: Returns the built-in default priority lists (for the "reset to
        default" button)
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/nyaa.Priorities'
              type: object
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Get default torrent priorities
      tags:
      - config
  /daemon/start:
    post:
      consumes:
      - application/json
      description: Starts the daemon loop for automatic anime checking
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Start daemon
      tags:
      - daemon
  /daemon/stop:
    post:
      consumes:
      - application/json
      description: Stops the daemon loop
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Stop daemon
      tags:
      - daemon
  /logs:
    get:
      consumes:
      - application/json
      description: Returns the last N lines from the daemon log file
      parameters:
      - description: 'Number of lines to return (default: 1000, max: 10000)'
        in: query
        name: lines
        type: integer
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.LogsResponse'
              type: object
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Get daemon logs
      tags:
      - logs
  /notifications/webhooks/{name}/test:
    post:
      description: Fires a named webhook with sample variables to verify connectivity
      parameters:
      - description: Webhook preset name
        in: path
        name: name
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Test a webhook preset
      tags:
      - notifications
  /status:
    get:
      consumes:
      - application/json
      description: Returns the current status of the daemon, including last check
        time, error state, and disk space for the configured save path
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.SuccessResponse'
            - properties:
                data:
                  $ref: '#/definitions/api.StatusResponse'
              type: object
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Get daemon status
      tags:
      - status
  /torrents:
    get:
      consumes:
      - application/json
      description: Returns a live snapshot of every torrent in the embedded client
        — progress, speed, ETA, peers and status — joined with the anime/episode it
        belongs to. Batch torrents appear once, with a null episode_number. Responds
        with an empty list (not an error) when no session exists yet, i.e. before
        completed_anime_path is configured.
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            allOf:
            - $ref: '#/definitions/api.SuccessResponse'
            - properties:
                data:
                  items:
                    $ref: '#/definitions/api.TorrentResponse'
                  type: array
              type: object
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: List torrents
      tags:
      - torrents
  /torrents/{hash}:
    delete:
      consumes:
      - application/json
      description: Removes a torrent and every saved episode sharing its hash, as
        a single unit (the deletion boundary is the torrent, not the episode, so a
        batch's episodes always leave together). By default this frees both the seeding
        copy and the library hardlink (same inode); keep_data=true keeps both instead.
        block=true additionally blocks every episode in the group against automatic
        re-download.
      parameters:
      - description: Torrent info hash
        in: path
        name: hash
        required: true
        type: string
      - description: Keep the seeding copy and library hardlinks on disk (default
          false)
        in: query
        name: keep_data
        type: boolean
      - description: Block the torrent's episodes against automatic re-download (default
          false)
        in: query
        name: block
        type: boolean
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Delete a torrent
      tags:
      - torrents
  /torrents/{hash}/announce:
    post:
      consumes:
      - application/json
      description: Re-announces the torrent to all trackers and DHT — the way out
        of "stuck at 0 peers". It does not override the trackers' minimum interval,
        so repeated calls have no extra effect.
      parameters:
      - description: Torrent info hash
        in: path
        name: hash
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Force a torrent re-announce
      tags:
      - torrents
  /torrents/{hash}/pause:
    post:
      consumes:
      - application/json
      description: 'Stops a torrent. Does not block: the torrent enters the "stopping"
        state and only reaches "stopped" up to ~5s later, once the stop event reaches
        the trackers. The paused state is persisted and survives a daemon restart.'
      parameters:
      - description: Torrent info hash
        in: path
        name: hash
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Pause a torrent
      tags:
      - torrents
  /torrents/{hash}/prioritize:
    post:
      consumes:
      - application/json
      description: Moves a torrent to the FRONT of the download queue and starts it
        immediately, pausing the least-progressed active torrent when that would exceed
        max_concurrent_downloads. Nothing is lost by the demotion — rain keeps the
        piece bitfield across a stop. A torrent that is already downloading is a no-op;
        an already-completed one is a 500.
      parameters:
      - description: Torrent info hash
        in: path
        name: hash
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Prioritize a torrent
      tags:
      - torrents
  /torrents/{hash}/resume:
    post:
      consumes:
      - application/json
      description: Puts a paused torrent at the BACK of the download queue and starts
        it if a slot is free — with max_concurrent_downloads set, resuming does not
        mean "start now" (use /prioritize for that). Re-arms the completion listener.
        A completed (seeding) torrent bypasses the queue.
      parameters:
      - description: Torrent info hash
        in: path
        name: hash
        required: true
        type: string
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "404":
          description: Not Found
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Resume a torrent
      tags:
      - torrents
  /torrents/prioritize:
    post:
      consumes:
      - application/json
      description: 'Moves every listed torrent to the FRONT of the download queue,
        in the order received, and starts as many as max_concurrent_downloads allows
        — whatever is pushed past the limit pauses. Unknown or already-completed hashes
        are ignored rather than rejected: a list of episodes must not fail whole because
        one of them finished between the render and the click. Use this instead of
        N calls to /torrents/{hash}/prioritize, which would reverse the batch.'
      parameters:
      - description: Info hashes, most important first
        in: body
        name: request
        required: true
        schema:
          $ref: '#/definitions/api.PrioritizeRequest'
      produces:
      - application/json
      responses:
        "200":
          description: OK
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "400":
          description: Bad Request
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "405":
          description: Method Not Allowed
          schema:
            $ref: '#/definitions/api.SuccessResponse'
        "500":
          description: Internal Server Error
          schema:
            $ref: '#/definitions/api.SuccessResponse'
      summary: Prioritize several torrents at once
      tags:
      - torrents
schemes:
- http
swagger: "2.0"
